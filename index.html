<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Unlimited Void</title>

    <style>

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;

        }

        html,
        body{

            width:100%;
            height:100%;
            overflow:hidden;

            background:#000;

        }

        body{

            position:fixed;
            inset:0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        canvas{

            display:block;

        }

        #loading{

            position:fixed;

            inset:0;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#000;

            color:#87c8ff;

            letter-spacing:8px;

            font-size:18px;

            z-index:1000;

            transition:
                opacity .5s ease;

        }

        #loading.hidden{

            opacity:0;

            pointer-events:none;

        }

    </style>

    <script type="importmap">

    {

        "imports":{

            "three":"https://unpkg.com/three@0.170.0/build/three.module.js",

            "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"

        }

    }

    </script>

</head>

<body>

    <div id="loading">

        INITIALIZING VOID

    </div>

    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
