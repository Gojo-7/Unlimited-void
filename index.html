<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Unlimited Void</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{

            width:100%;
            height:100%;
            overflow:hidden;
            background:#000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        canvas{

            display:block;

        }

        #loading{

            position:fixed;

            inset:0;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#000;

            color:#8dc7ff;

            letter-spacing:8px;

            font-size:18px;

            z-index:999;

            transition:
                opacity .6s;

        }

        #loading.hidden{

            opacity:0;
            pointer-events:none;

        }

        #title{

            position:fixed;

            top:30px;
            left:50%;

            transform:translateX(-50%);

            color:white;

            font-size:18px;

            letter-spacing:10px;

            opacity:.75;

            user-select:none;

            pointer-events:none;

            z-index:20;

        }

    </style>

</head>

<body>

    <div id="loading">

        INITIALIZING VOID

    </div>

    <div id="title">

        UNLIMITED VOID

    </div>

    <script type="importmap">

    {
        "imports":{

            "three":"https://unpkg.com/three@0.170.0/build/three.module.js",

            "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"

        }
    }

    </script>

    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
